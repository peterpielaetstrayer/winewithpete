name: Security Release Review

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/security-release-review.yml'
      - 'docs/security-patch-review-2026-10-24.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-build:
    name: Current advisory audit and Next build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install reviewed lockfile
        run: npm ci

      - name: Assert resolved production PostCSS version
        run: |
          node -e "const p=require('postcss/package.json'); if (p.version !== '8.5.31') process.exit(1); console.log('PostCSS version: '+p.version)"
          test ! -e node_modules/next/node_modules/postcss/package.json

      - name: Audit production dependencies at high threshold
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build actual Next application with inert CI configuration
        id: build
        continue-on-error: true
        env:
          # Never use real credentials: the build must not access live services.
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-real
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-real
          STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_real
        run: npm run build

      - name: Fail release review if audit or build failed
        if: always()
        env:
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          echo "Production dependency audit: $AUDIT_RESULT"
          echo "Next application build: $BUILD_RESULT"
          test "$AUDIT_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
