name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - commerce-architecture-v1

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck commerce changes
        run: npm run typecheck:commerce

      - name: Lint commerce changes
        run: npm run lint:commerce

  public-commerce-security:
    name: Public commerce security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository (read-only)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Test public commerce source contracts
        run: node --test tests/commerce-public-safety.test.mjs
