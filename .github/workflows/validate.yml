name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - commerce-architecture-v1

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck commerce changes
        run: npm run typecheck:commerce

      - name: Lint commerce changes
        run: npm run lint:commerce
