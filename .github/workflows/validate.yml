name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - commerce-architecture-v1

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-commerce-security:
    name: Public commerce security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Test public commerce source contracts
        run: node --test tests/commerce-public-safety.test.mjs

  quality:
    name: Commerce and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Verify preview deployment exclusion
        run: node scripts/check-deployment-policy.mjs
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Typecheck commerce changes
        run: npm run typecheck:commerce
      - name: Lint commerce changes
        run: npm run lint:commerce
