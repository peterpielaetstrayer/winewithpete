name: Field guide branch QA

on:
  push:
    branches:
      - feature/interactive-field-guides-v01

permissions:
  contents: write

concurrency:
  group: field-guide-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-upgrade:
    if: github.ref == 'refs/heads/feature/interactive-field-guides-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing locked dependencies
        run: npm ci

      - name: Apply reviewed October security patch versions
        run: npm install --save-exact next@15.5.28 react@19.1.10 react-dom@19.1.10 sharp@0.35.5

      - name: Apply nonbreaking transitive security fixes
        run: npm audit fix --omit=dev

      - name: Typecheck the new field guide independently
        run: npx tsc -p tsconfig.field-guides.json --noEmit

      - name: Lint the new field guide independently
        run: npx eslint src/app/guides/better-taco-night

      - name: Regression test all four recipe batch sizes
        run: node --experimental-strip-types --test tests/field-guide-quantities.test.mjs

      - name: Verify security audit and summarize remaining advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Commit reviewed security versions and lockfile to feature branch only
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest or lockfile changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(security): update Next React and image packages"
            git fetch origin feature/interactive-field-guides-v01
            git rebase origin/feature/interactive-field-guides-v01
            git push origin HEAD:feature/interactive-field-guides-v01
          fi

      - name: Build entire application using nonproduction test configuration
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-only-placeholder
        run: npm run build

      - name: Record existing application-wide TypeScript debt (non-gating)
        continue-on-error: true
        run: npm run typecheck

      - name: Record existing application-wide lint debt (non-gating)
        continue-on-error: true
        run: npm run lint

      - name: Hard gate remaining critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
