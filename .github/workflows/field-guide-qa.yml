name: Field guide branch QA

on:
  push:
    branches:
      - feature/interactive-field-guides-v01

permissions:
  contents: write

concurrency:
  group: field-guide-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-upgrade:
    if: github.ref == 'refs/heads/feature/interactive-field-guides-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing locked dependencies
        run: npm ci

      - name: Apply reviewed October security patch versions
        run: npm install --save-exact next@15.5.28 react@19.1.10 react-dom@19.1.10 sharp@0.35.5

      - name: Typecheck all application files
        run: npm run typecheck

      - name: Lint all application files
        run: npm run lint

      - name: Build the complete Next application
        run: npm run build

      - name: Commit tested manifest and lockfile to feature branch only
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest or lockfile changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(security): update verified Next React and image packages"
            git push origin HEAD:feature/interactive-field-guides-v01
          fi

      - name: Audit production dependencies after upgrade
        run: npm audit --omit=dev --audit-level=critical
